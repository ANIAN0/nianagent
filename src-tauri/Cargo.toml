[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }
base64 = "=0.22.1"
minisign-verify = "=0.2.5"

[dependencies]
dunce = "1.0.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
fs2 = "0.4.3"
semver = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
rfd = "=0.16.0"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-updater = "=2.13.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"

[target."cfg(windows)".dependencies]
windows-core = "0.62.2"
webview2-com = "0.39.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
